apiVersion: v1
kind: Namespace
metadata: {name: certiheal}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: roles, namespace: certiheal}
spec:
  replicas: 12
  selector: {matchLabels: {app: role}}
  template:
    metadata: {labels: {app: role}}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: role
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
        resources: {requests: {cpu: "3000m", memory: "48Mi"}}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {matchLabels: {app: role}}
