# Heterogeneous roles cho thi nghiem reservation tren K3s that.
# 'roles' (nho, 3cpu) + 'roles-big' (to, 9cpu), cung label app=role.
# Muc dich: model uniform-slot (cap = cpu//3 = 10 slot/node) OVER-PROMISE khi co pod to,
# con reservation bin-pack theo cpu THAT se bat duoc -> chung minh loi ich fail-closed.
# Con so: 30x3cpu + 15x9cpu = 45 pod, 225 cpu. Slot-cert feasible toi L<=11; cpu that toi L<=8
# => false-safe zone L in {9,10,11}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roles-big
  namespace: certiheal
spec:
  replicas: 15
  selector:
    matchLabels: {app: role, size: big}
  template:
    metadata:
      labels: {app: role, size: big}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: role
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
        resources:
          requests: {cpu: "9", memory: "48Mi"}
